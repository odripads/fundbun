<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="fb-title fb-desc">
  <title id="fb-title">FundBun</title>
  <desc id="fb-desc">Direction B, gua bao: a folded steamed bun whose filling is a gold Yuan sign, with a friendly face (the mascot Bun).</desc>
  <defs>
    <path id="half" d="M62 350 C 54 314, 82 300, 112 304 C 200 286, 312 286, 400 304 C 430 300, 458 314, 450 350 C 440 424, 360 466, 256 466 C 152 466, 72 424, 62 350 Z"/>
    <clipPath id="frontClip"><use href="#half"/></clipPath>
  </defs>
  <!-- steam -->
  <g fill="none" stroke="#E2B878" stroke-width="14" stroke-linecap="round">
    <path d="M104 226 c -14 -18, 14 -30, 0 -50 s 12 -32, 2 -46"/>
    <path d="M412 200 c -14 -18, 14 -30, 0 -50 s 12 -32, 2 -46"/>
  </g>
  <g transform="rotate(-10 256 350)">
    <!-- back half of the folded bun -->
    <use href="#half" transform="translate(12 -40)" fill="#EFD7AD" stroke="#3A2A1F" stroke-width="14" stroke-linejoin="round"/>
  </g>
  <!-- the filling: ¥ -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#3A2A1F" stroke-width="64">
      <path d="M182 70 L256 172 L330 70"/><path d="M256 172 L256 390"/>
      <path d="M190 204 L322 204"/><path d="M190 256 L322 256"/>
    </g>
    <g stroke="#E3A21A" stroke-width="38">
      <path d="M182 70 L256 172 L330 70"/><path d="M256 172 L256 390"/>
      <path d="M190 204 L322 204"/><path d="M190 256 L322 256"/>
    </g>
  </g>
  <g transform="rotate(-10 256 350)">
    <!-- garnish: cilantro + scallion leaf -->
    <path d="M112 314 C 98 286, 118 260, 148 264 C 154 238, 190 236, 200 260 C 216 270, 214 296, 200 312 Z"
          fill="#4FB08A" stroke="#3A2A1F" stroke-width="14" stroke-linejoin="round"/>
    <path d="M326 312 C 332 280, 362 262, 400 266 C 396 296, 366 316, 326 312 Z"
          fill="#2E8B66" stroke="#3A2A1F" stroke-width="14" stroke-linejoin="round"/>
    <!-- front half -->
    <use href="#half" fill="#F6E7CC"/>
    <g clip-path="url(#frontClip)">
      <ellipse cx="256" cy="482" rx="236" ry="66" fill="#EFD7AD"/>
      <path d="M108 326 C 150 314, 190 310, 226 310" fill="none" stroke="#FFFAF2" stroke-width="14" stroke-linecap="round"/>
    </g>
    <use href="#half" fill="none" stroke="#3A2A1F" stroke-width="14" stroke-linejoin="round"/>
    <!-- face (Bun) -->
    <ellipse cx="160" cy="390" rx="22" ry="12" fill="#EE6A4D" opacity=".55"/>
    <ellipse cx="352" cy="390" rx="22" ry="12" fill="#EE6A4D" opacity=".55"/>
    <circle cx="204" cy="370" r="14" fill="#3A2A1F"/>
    <circle cx="308" cy="370" r="14" fill="#3A2A1F"/>
    <path d="M240 390 Q 256 406 272 390" fill="none" stroke="#3A2A1F" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
