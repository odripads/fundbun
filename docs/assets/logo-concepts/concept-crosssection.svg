<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" stroke-linecap="round" stroke-linejoin="round">
<title>FundBun — cut-open baozi with a yuan filling</title>
<style>
  /* Favicon sizes: drop the steam and re-centre the bun (browsers only; other rasterisers keep the full mark). */
  @media (max-width: 48px) {
    .steam { display: none }
    .bun { transform: translateY(-34px) }
  }
</style>
<defs>
  <!-- palette: soy #3A2A1F/#24180F, bamboo #B9874B/#8F6232, dough #EFD7AD, cream #FFF4E3, yuan #E3A21A/#F2BD3D -->
  <radialGradient id="fb-fill" cx="50%" cy="55%" r="60%">
    <stop offset="0" stop-color="#8F6232"/>
    <stop offset=".62" stop-color="#3A2A1F"/>
    <stop offset="1" stop-color="#24180F"/>
  </radialGradient>
  <radialGradient id="fb-halo" cx="50%" cy="50%" r="50%">
    <stop offset=".55" stop-color="#F2BD3D" stop-opacity=".75"/>
    <stop offset="1" stop-color="#F2BD3D" stop-opacity="0"/>
  </radialGradient>
  <!-- whole bun silhouette with the pinched, pleated top -->
  <path id="fb-body" d="M38 378C36 250 128 154 222 142C236 140 246 128 256 118C266 128 276 140 290 142C384 154 476 250 474 378C473 434 444 464 396 464H116C68 464 39 434 38 378Z"/>
  <!-- top edge of the cut face -->
  <path id="fb-arc" d="M14 372C52 262 146 200 256 198C366 200 460 262 498 372"/>
  <clipPath id="fb-skin"><use href="#fb-body"/></clipPath>
  <clipPath id="fb-below"><path d="M14 372C52 262 146 200 256 198C366 200 460 262 498 372V512H14Z"/></clipPath>
  <g id="fb-yen"><path d="M202 276L256 332L310 276"/><path d="M256 332V410"/><path d="M208 344H304M208 384H304"/></g>
</defs>

<g class="steam" fill="none" stroke="#B9874B" stroke-width="14">
  <path d="M174 104C158 88 188 74 174 54C166 42 174 32 180 26"/>
  <path d="M338 104C322 88 352 74 338 54C330 42 338 32 344 26"/>
</g>

<g class="bun">
  <!-- back half: outer skin, pleats swirling into the pinch -->
  <use href="#fb-body" fill="#EFD7AD"/>
  <g clip-path="url(#fb-skin)" fill="none" stroke="#B9874B" stroke-width="8">
    <path d="M60 318C100 214 180 160 248 128"/>
    <path d="M134 240C168 192 216 154 250 128"/>
    <path d="M204 208C226 178 240 148 254 126"/>
    <path d="M278 200C292 176 280 148 258 126"/>
    <path d="M346 208C356 180 306 148 262 128"/>
    <path d="M414 242C418 198 338 156 264 128"/>
    <path d="M458 320C462 232 380 160 266 128"/>
  </g>

  <!-- front: the cut face, lit gold by the filling -->
  <g clip-path="url(#fb-below)">
    <use href="#fb-body" fill="#FFF4E3"/>
    <ellipse cx="256" cy="336" rx="188" ry="140" fill="url(#fb-halo)"/>
  </g>
  <use href="#fb-arc" fill="none" stroke="#3A2A1F" stroke-width="8" clip-path="url(#fb-skin)"/>
  <use href="#fb-body" fill="none" stroke="#3A2A1F" stroke-width="14"/>

  <!-- filling: the yuan -->
  <path d="M256 230C344 228 396 278 396 336C396 400 342 438 256 438C170 438 116 400 116 336C116 278 168 228 256 230Z" fill="url(#fb-fill)" stroke="#E3A21A" stroke-width="8"/>
  <use href="#fb-yen" fill="none" stroke="#3A2A1F" stroke-width="44"/>
  <use href="#fb-yen" fill="none" stroke="#F2BD3D" stroke-width="28"/>
  <path d="M206 272L218 284" fill="none" stroke="#FFF4E3" stroke-width="8" opacity=".85"/>
</g>
</svg>
