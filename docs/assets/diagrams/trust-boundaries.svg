<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#24180F"/>
    </marker>
    <marker id="a-chili" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D9472B"/>
    </marker>
    <marker id="a-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B97F08"/>
    </marker>
    <marker id="a-jade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E8B66"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#FFFAF2"/>

  <!-- title -->
  <text x="40" y="54" font-size="28" font-weight="700" fill="#24180F">FundBun trust boundaries</text>
  <text x="40" y="84" font-size="16" fill="#5E4E40">What runs on the device, what is untrusted, and what may cross to the LLM gateway and provider</text>

  <!-- user -->
  <rect x="530" y="110" width="274" height="56" rx="12" fill="#DDF0E7" stroke="#2E8B66" stroke-width="2"/>
  <text x="667" y="134" font-size="16" font-weight="700" fill="#24180F" text-anchor="middle">User (human)</text>
  <text x="667" y="155" font-size="14" fill="#24180F" text-anchor="middle">chat, taps, PIN, kill switch</text>
  <line x1="667" y1="166" x2="667" y2="223" stroke="#2E8B66" stroke-width="2" marker-end="url(#a-jade)"/>

  <!-- device boundary -->
  <rect x="300" y="190" width="520" height="610" rx="20" fill="none" stroke="#24180F" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="318" y="218" font-size="14" font-weight="700" fill="#24180F" letter-spacing="0.6">USER'S DEVICE</text>
  <text x="318" y="238" font-size="14" fill="#5E4E40">browser, local-first</text>

  <!-- main column: UI -->
  <rect x="530" y="226" width="274" height="56" rx="10" fill="#FFFFFF" stroke="#CDBFAE" stroke-width="1.5"/>
  <text x="667" y="250" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">UI + AppApi controller</text>
  <text x="667" y="270" font-size="14" fill="#5E4E40" text-anchor="middle">one API for every screen</text>
  <line x1="667" y1="282" x2="667" y2="303" stroke="#24180F" stroke-width="1.8" marker-end="url(#a-ink)"/>

  <!-- agent runtime -->
  <rect x="530" y="306" width="274" height="76" rx="10" fill="#FFFFFF" stroke="#CDBFAE" stroke-width="1.5"/>
  <text x="667" y="330" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Agent runtime</text>
  <text x="667" y="350" font-size="14" fill="#5E4E40" text-anchor="middle">Bun Engine or LLM tool loop</text>
  <text x="667" y="369" font-size="14" fill="#5E4E40" text-anchor="middle">proposes tool calls only</text>
  <line x1="667" y1="382" x2="667" y2="403" stroke="#24180F" stroke-width="1.8" marker-end="url(#a-ink)"/>

  <!-- policy engine -->
  <rect x="530" y="406" width="274" height="76" rx="10" fill="#DDF0E7" stroke="#2E8B66" stroke-width="2"/>
  <text x="667" y="430" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Policy engine (decides)</text>
  <text x="667" y="450" font-size="14" fill="#24180F" text-anchor="middle">tier × autonomy, caps, taint,</text>
  <text x="667" y="469" font-size="14" fill="#24180F" text-anchor="middle">entities, liquidity → decision</text>
  <line x1="667" y1="482" x2="667" y2="503" stroke="#24180F" stroke-width="1.8" marker-end="url(#a-ink)"/>

  <!-- approval -->
  <rect x="530" y="506" width="274" height="76" rx="10" fill="#FFFFFF" stroke="#CDBFAE" stroke-width="1.5"/>
  <text x="667" y="530" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Action card + approval</text>
  <text x="667" y="550" font-size="14" fill="#5E4E40" text-anchor="middle">built from structured data</text>
  <text x="667" y="569" font-size="14" fill="#5E4E40" text-anchor="middle">binding hash · PIN step-up</text>
  <line x1="667" y1="582" x2="667" y2="603" stroke="#24180F" stroke-width="1.8" marker-end="url(#a-ink)"/>

  <!-- sandbox bank -->
  <rect x="530" y="606" width="274" height="76" rx="10" fill="#DDF0E7" stroke="#2E8B66" stroke-width="2"/>
  <text x="667" y="630" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Sandbox bank (own checks)</text>
  <text x="667" y="650" font-size="14" fill="#24180F" text-anchor="middle">own accounts, verified payees</text>
  <text x="667" y="669" font-size="14" fill="#24180F" text-anchor="middle">agent limit ¥5,000 per day</text>
  <line x1="686" y1="682" x2="686" y2="707" stroke="#24180F" stroke-width="1.8" marker-end="url(#a-ink)"/>

  <!-- gate -->
  <rect x="318" y="306" width="178" height="276" rx="10" fill="#FBE3DC" stroke="#D9472B" stroke-width="2"/>
  <text x="407" y="334" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Untrusted-text</text>
  <text x="407" y="354" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">gate</text>
  <text x="407" y="390" font-size="14" fill="#24180F" text-anchor="middle">strip hidden chars</text>
  <text x="407" y="416" font-size="14" fill="#24180F" text-anchor="middle">wrap in &lt;untrusted&gt;</text>
  <text x="407" y="442" font-size="14" fill="#24180F" text-anchor="middle">scan bills + memos</text>
  <text x="407" y="468" font-size="14" fill="#24180F" text-anchor="middle">taint the turn:</text>
  <text x="407" y="490" font-size="14" fill="#24180F" text-anchor="middle">money never</text>
  <text x="407" y="512" font-size="14" fill="#24180F" text-anchor="middle">moves without a tap</text>
  <line x1="496" y1="344" x2="527" y2="344" stroke="#D9472B" stroke-width="2" marker-end="url(#a-chili)"/>
  <line x1="496" y1="444" x2="527" y2="444" stroke="#D9472B" stroke-width="2" marker-end="url(#a-chili)"/>

  <!-- storage + audit -->
  <rect x="318" y="710" width="230" height="72" rx="10" fill="#FFFFFF" stroke="#CDBFAE" stroke-width="1.5"/>
  <text x="433" y="738" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Local storage</text>
  <text x="433" y="760" font-size="14" fill="#5E4E40" text-anchor="middle">plain, or AES-GCM vault</text>
  <rect x="566" y="710" width="238" height="72" rx="10" fill="#FFFFFF" stroke="#CDBFAE" stroke-width="1.5"/>
  <text x="685" y="738" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Audit log</text>
  <text x="685" y="760" font-size="14" fill="#5E4E40" text-anchor="middle">SHA-256 hash chain</text>

  <!-- untrusted inputs -->
  <text x="30" y="262" font-size="14" font-weight="700" fill="#D9472B" letter-spacing="0.6">UNTRUSTED INPUTS</text>
  <text x="30" y="284" font-size="14" fill="#5E4E40">data, never instructions</text>

  <rect x="30" y="300" width="240" height="56" rx="10" fill="#FFFFFF" stroke="#D9472B" stroke-width="1.8"/>
  <text x="150" y="323" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Bill text</text>
  <text x="150" y="343" font-size="14" fill="#5E4E40" text-anchor="middle">X-ray paste, sandbox bills</text>
  <line x1="270" y1="328" x2="315" y2="328" stroke="#D9472B" stroke-width="2" marker-end="url(#a-chili)"/>

  <rect x="30" y="372" width="240" height="56" rx="10" fill="#FFFFFF" stroke="#D9472B" stroke-width="1.8"/>
  <text x="150" y="395" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Transaction memos</text>
  <text x="150" y="415" font-size="14" fill="#5E4E40" text-anchor="middle">bank feed and CSV imports</text>
  <line x1="270" y1="400" x2="315" y2="400" stroke="#D9472B" stroke-width="2" marker-end="url(#a-chili)"/>

  <rect x="30" y="444" width="240" height="56" rx="10" fill="#FFFFFF" stroke="#D9472B" stroke-width="1.8"/>
  <text x="150" y="467" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Long pasted messages</text>
  <text x="150" y="487" font-size="14" fill="#5E4E40" text-anchor="middle">over 400 characters</text>
  <line x1="270" y1="472" x2="315" y2="472" stroke="#D9472B" stroke-width="2" marker-end="url(#a-chili)"/>

  <rect x="30" y="516" width="240" height="56" rx="10" fill="#FFFFFF" stroke="#D9472B" stroke-width="1.8"/>
  <text x="150" y="539" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">Dream names + notes</text>
  <text x="150" y="559" font-size="14" fill="#5E4E40" text-anchor="middle">typed by the user</text>
  <line x1="270" y1="544" x2="315" y2="544" stroke="#D9472B" stroke-width="2" marker-end="url(#a-chili)"/>

  <!-- crossing to the gateway -->
  <line x1="804" y1="330" x2="917" y2="330" stroke="#B97F08" stroke-width="2.4" marker-end="url(#a-gold)"/>
  <text x="868" y="318" font-size="14" font-weight="700" fill="#8A5E00" text-anchor="middle">redacted</text>
  <line x1="920" y1="362" x2="807" y2="362" stroke="#D9472B" stroke-width="2.4" marker-end="url(#a-chili)"/>
  <text x="868" y="384" font-size="14" font-weight="700" fill="#D9472B" text-anchor="middle">proposals</text>

  <!-- what crosses -->
  <rect x="920" y="104" width="250" height="186" rx="12" fill="#FBEFD3" stroke="#E3A21A" stroke-width="2"/>
  <text x="936" y="130" font-size="15" font-weight="700" fill="#24180F">Crosses only with a</text>
  <text x="936" y="150" font-size="15" font-weight="700" fill="#24180F">separate LLM consent</text>
  <text x="936" y="176" font-size="14" fill="#24180F">• redacted prompt + chat</text>
  <text x="936" y="198" font-size="14" fill="#24180F">• T0–T3 tool definitions</text>
  <text x="936" y="220" font-size="14" fill="#24180F">• compact tool results</text>
  <text x="936" y="242" font-size="14" fill="#24180F">• untrusted text wrapped</text>
  <text x="936" y="270" font-size="14" fill="#5E4E40">never: PIN hash, photos, audit</text>

  <!-- gateway -->
  <rect x="920" y="306" width="250" height="206" rx="12" fill="#FFFFFF" stroke="#24180F" stroke-width="2"/>
  <text x="1045" y="332" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">LLM gateway (server/)</text>
  <text x="936" y="360" font-size="14" fill="#24180F">same-origin requests only</text>
  <text x="936" y="382" font-size="14" fill="#24180F">30 requests/min per IP</text>
  <text x="936" y="404" font-size="14" fill="#24180F">strict schema, 256 KB cap</text>
  <text x="936" y="426" font-size="14" fill="#24180F">T4 tools refused</text>
  <text x="936" y="448" font-size="14" fill="#24180F">re-redacts PII, fails closed</text>
  <text x="936" y="470" font-size="14" fill="#24180F">logs no request bodies</text>
  <text x="936" y="492" font-size="14" fill="#24180F">holds the API key</text>

  <!-- provider -->
  <line x1="1020" y1="512" x2="1020" y2="577" stroke="#B97F08" stroke-width="2.4" marker-end="url(#a-gold)"/>
  <text x="1010" y="550" font-size="14" fill="#8A5E00" text-anchor="end">request</text>
  <line x1="1070" y1="580" x2="1070" y2="515" stroke="#D9472B" stroke-width="2.4" marker-end="url(#a-chili)"/>
  <text x="1080" y="550" font-size="14" fill="#D9472B">reply</text>
  <rect x="920" y="580" width="250" height="102" rx="12" fill="#F3ECE2" stroke="#8C7B6A" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="1045" y="606" font-size="15" font-weight="700" fill="#24180F" text-anchor="middle">LLM provider (external)</text>
  <text x="1045" y="628" font-size="14" fill="#5E4E40" text-anchor="middle">Anthropic, OpenAI-compatible</text>
  <text x="1045" y="648" font-size="14" fill="#5E4E40" text-anchor="middle">or deterministic mock</text>
  <text x="1045" y="669" font-size="14" fill="#D9472B" text-anchor="middle">its output is untrusted</text>

  <!-- legend -->
  <rect x="30" y="830" width="1140" height="46" rx="10" fill="#FFFFFF" stroke="#E6DACB" stroke-width="1"/>
  <rect x="48" y="845" width="18" height="18" rx="4" fill="#FBE3DC" stroke="#D9472B" stroke-width="2"/>
  <text x="74" y="859" font-size="14" fill="#24180F">untrusted input or model output</text>
  <rect x="320" y="845" width="18" height="18" rx="4" fill="#DDF0E7" stroke="#2E8B66" stroke-width="2"/>
  <text x="346" y="859" font-size="14" fill="#24180F">deterministic control that decides</text>
  <rect x="606" y="845" width="18" height="18" rx="4" fill="#FBEFD3" stroke="#E3A21A" stroke-width="2"/>
  <text x="632" y="859" font-size="14" fill="#24180F">crosses the device boundary</text>
  <line x1="866" y1="854" x2="904" y2="854" stroke="#24180F" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="914" y="859" font-size="14" fill="#24180F">trust boundary (user's device)</text>
</svg>
