name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Unit + integration tests
        run: npm test
      - name: Scripted scenarios (execution evidence)
        run: npm run evidence -- --out /tmp/evidence
      - name: Production build
        run: npm run build
