name: Desktop release

# Builds the FundBun desktop app on macOS, Windows and Linux. Started by hand only (Actions tab, or
# `gh workflow run desktop-release.yml -f release_tag=v1.0.0-preview`). With a release_tag, the three archives and
# SHA256SUMS.txt are attached to that existing GitHub release; without one they stay as workflow artifacts.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release to attach the files to (for example v1.0.0-preview). Leave empty to only build.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: mac-arm64
            file: mac-arm64.dmg
          - os: windows-latest
            label: win-x64
            file: win-x64.zip
          - os: ubuntu-latest
            label: linux-x64
            file: linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and package
        run: npm run desktop:build
      - name: Checksum
        id: sum
        run: |
          version=$(node -p "require('./package.json').version")
          name="FundBun-${version}-${{ matrix.file }}"
          test -f "desktop/release/${name}"
          cd desktop/release
          if command -v sha256sum >/dev/null; then sha256sum "${name}"; else shasum -a 256 "${name}"; fi | awk '{print $1 "  " $2}' | tr -d '*' > "${name}.sha256"
          cat "${name}.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: FundBun-${{ matrix.label }}
          path: |
            desktop/release/${{ steps.sum.outputs.name }}
            desktop/release/${{ steps.sum.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Combine checksums
        working-directory: out
        run: |
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 3
      - name: Attach to the release
        working-directory: out
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber FundBun-*.dmg FundBun-*.zip FundBun-*.tar.gz SHA256SUMS.txt
